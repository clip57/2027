<script>/* motyw i ustawienia wyglądu przed pierwszym renderem (domyślnie ciemny; preferencje per urządzenie: akcent, gęstość, rozmiar tekstu — D-113) + kolor paska przeglądarki (= --bg) */(function(){var d=document.documentElement,g=function(k){try{return localStorage.getItem("p2027."+k)}catch(e){return null}},t=g("theme");if(t!=="system")d.setAttribute("data-theme",t==="light"?"light":"dark");["accent","density","text"].forEach(function(k){var v=g(k);if(v&&/^[a-z]+$/.test(v))d.setAttribute("data-"+k,v)});if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.querySelector('meta[name="theme-color"]').setAttribute("content","#f5f7fa")})()</script>
