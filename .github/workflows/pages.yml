# Publikacja na GitHub Pages (bezpłatnie dla repozytoriów publicznych — D-034).
# Każdy push do gałęzi main: pełne testy (testy.yml — U2, audyt 23.10.2026: jednostkowe, kontrola planu, E2E, dostępność, synchronizacja)
# -> budowa -> publikacja dist/web. Błąd testów zatrzymuje publikację (strona zostaje w poprzedniej wersji).
# Akcje w wersjach na Node 24 (D-111, 25.10.2026 — Node 20 wycofany z runnerów GitHub).
name: Publikacja 2027
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  testy:
    uses: ./.github/workflows/testy.yml
    permissions: { contents: read }
  build:
    needs: testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/web, include-hidden-files: true }   # .nojekyll w paczce jak dotąd (od v4 pliki z kropką domyślnie pomijane)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
